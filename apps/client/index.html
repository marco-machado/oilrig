<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Home</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1822'/%3E%3Crect x='11' y='6.4' width='10' height='5' rx='.8' fill='%237fd8e333' stroke='%237fd8e3' stroke-width='1.3'/%3E%3Cpath d='M6 12h20' stroke='%23f2b40c' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M9.5 12v12.5M22.5 12v12.5M9.5 15.8l13 5.2M22.5 15.8l-13 5.2' stroke='%23f2b40c' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M4.5 24c1.9 0 1.9-1.2 3.8-1.2s1.9 1.2 3.8 1.2 1.9-1.2 3.8-1.2 1.9 1.2 3.8 1.2 1.9-1.2 3.8-1.2 1.9 1.2 3.8 1.2' stroke='%233f9cc4' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/base.css" />
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="glow"></div>
      <canvas class="sea far" aria-hidden="true"></canvas>
      <canvas class="sea near" aria-hidden="true"></canvas>
      <div class="content">
        <div class="brand">
          <svg class="oh-mark" width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0a1822"/><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="rgba(190,222,238,.16)"/><rect x="11" y="6.4" width="10" height="5" rx=".8" fill="rgba(127,216,227,.2)" stroke="#7fd8e3" stroke-width="1.3"/><path d="M6 12h20" stroke="#f2b40c" stroke-width="2.2" stroke-linecap="round"/><path d="M9.5 12v12.5M22.5 12v12.5M9.5 15.8l13 5.2M22.5 15.8l-13 5.2" stroke="#f2b40c" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M4.5 24c1.9 0 1.9-1.2 3.8-1.2s1.9 1.2 3.8 1.2 1.9-1.2 3.8-1.2 1.9 1.2 3.8 1.2 1.9-1.2 3.8-1.2 1.9 1.2 3.8 1.2" stroke="#3f9cc4" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <span class="oh-eyebrow">23°36′S · 42°24′W · Deck +20 m</span>
        </div>
        <h1 class="oh-wordmark">Ocean Home</h1>
        <p class="tagline">A glass pavilion on a converted platform, 20 m above the open ocean.</p>
      </div>
      <div class="horizon">
        <div class="meta"><span class="step">Loading</span><span class="pct">0%</span></div>
        <div class="line"><div class="fill"></div></div>
        <p class="hint">The first visit compiles the ocean and lighting shaders, so it takes a little longer.</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
